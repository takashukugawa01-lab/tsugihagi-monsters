<style>
/* 漫画の原稿用紙の上で遊ぶ：白い紙、青いけい線、黒いインク。単一の見た目に決めている */
:root{--paper:#fdfdfb;--rule:#cfe6ee;--ink:#17171b;--mute:#6c6c75;--red:#e5484d;--blue:#2f7fd6;--green:#2fa35a;--gold:#c8930a;--pop:'Mochiy Pop One','Hiragino Maru Gothic ProN',sans-serif;--body:'Zen Maru Gothic','Hiragino Maru Gothic ProN',sans-serif;color-scheme:light}

#app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px;min-height:100%}

.big{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:68px;background:var(--ink);color:var(--paper);font-family:var(--pop);font-size:22px;border-radius:14px 18px 12px 20px;padding-inline:12px}
.big.sub{background:var(--paper);color:var(--ink);border:3px solid var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1 1 140px;min-width:0}
.guide{display:flex;gap:10px;align-items:flex-end}
.guide img{width:84px;height:84px;object-fit:cover;object-position:top;border-radius:50%;border:3px solid var(--ink);flex:none;background:#111}
.bubble{position:relative;background:var(--paper);border:3px solid var(--ink);border-radius:18px;padding:10px 14px;font-weight:900;font-size:17px;min-width:0}

.steps{display:flex;gap:8px}
.slot{flex:1;min-width:0;aspect-ratio:1;border:3px dashed var(--ink);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:clamp(26px,9vw,40px);background:var(--paper)}
.slot.on{border-style:solid;box-shadow:inset 0 0 0 3px #ffd84a}

.part{position:relative;aspect-ratio:1;background:var(--paper);border:2px solid var(--ink);border-radius:10px;font-size:clamp(24px,8vw,36px);display:flex;align-items:center;justify-content:center}

.mon{position:relative;width:var(--s);height:var(--s);flex:none}
.mon svg{display:block;width:100%;height:100%;pointer-events:none;overflow:visible}
.stage{position:relative;height:340px;overflow:hidden;background:radial-gradient(circle,#555568,#1d1d26);border:3px solid var(--ink);border-radius:8px;display:flex;align-items:center;justify-content:center}
.stage .vx{position:absolute;inset:0}
.stage .vx span{position:absolute;left:50%;top:50%;font-size:46px;margin:-23px 0 0 -23px;animation:spin .9s cubic-bezier(.5,0,.9,.6) var(--d) forwards}
@keyframes spin{from{transform:rotate(var(--a)) translateX(120px) rotate(calc(var(--a)*-1)) scale(1.1)}to{transform:rotate(calc(var(--a) + 720deg)) translateX(0) rotate(calc(var(--a)*-1 - 720deg)) scale(.05)}}
.stage .newm{display:none}
.stage[data-p="2"] .vx,.stage[data-p="3"] .vx{display:none}
.stage[data-p="2"] .newm{display:block;filter:brightness(0) drop-shadow(0 0 8px #fffa);animation:shake .5s}
.stage[data-p="3"] .newm{display:block;animation:pop .5s}
.stage .fl{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.stage[data-p="3"] .fl{animation:flash .6s}
.stage .tap{position:absolute;bottom:8px;left:0;right:0;text-align:center;color:#bbb;font-size:13px}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px) scale(.9)}40%{transform:translateX(6px) scale(.95)}60%{transform:translateX(-4px) scale(1)}80%{transform:translateX(4px)}}
@keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.15)}100%{transform:scale(1)}}

.pops{animation:pop .5s}

.stage[data-p="3"]:before{content:"";position:absolute;inset:-40%;background:repeating-conic-gradient(var(--rc) 0 3deg,transparent 3deg 12deg);animation:flash .9s;pointer-events:none}
.tc{position:relative;border:4px solid var(--ink);border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:6px;background:#fff;box-shadow:5px 5px 0 var(--ink);--tc:#cfd2da}
.tc.r{--tc:#ffd2d0}.tc.b{--tc:#cfe3ff}.tc.g{--tc:#cdf0d6}

.tcm{text-align:center;font-size:22px}.tcm small{font-size:12px;font-family:var(--pop);color:var(--mute)}

.tct,.tck{font-size:13px;color:var(--mute)}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:4px;border:2px solid var(--ink);vertical-align:-1px}
.dot.r{background:var(--red)}.dot.b{background:var(--blue)}.dot.g{background:var(--green)}
.tcv{background:#ffd84a;border:3px solid var(--ink);border-radius:10px;padding:6px 10px;font-family:var(--pop);font-size:17px}
.tcv b{font-size:12px;background:var(--ink);color:#ffd84a;padding:1px 6px;border-radius:6px;margin-right:4px}
.sp{position:relative;overflow:hidden;min-height:64px;border:3px solid var(--ink);border-radius:14px;background:#fff;font-family:var(--pop);font-size:18px}
.sp i{position:absolute;left:0;top:0;bottom:0;width:0;background:#ffd84a}
.sp b{position:relative;font-weight:400}
.legend{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--mute)}
.mon.r svg{filter:drop-shadow(0 0 2px var(--red))}.mon.b svg{filter:drop-shadow(0 0 2px var(--blue))}.mon.g svg{filter:drop-shadow(0 0 2px var(--green))}
.sheet{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

.card{display:flex;gap:12px;align-items:center;border:3px solid var(--ink);border-radius:14px;background:var(--paper);padding:10px;min-width:0}
.card>div:last-child{min-width:0;flex:1}
.nm{font-family:var(--pop);font-size:18px;overflow-wrap:anywhere}
.rar{display:inline-block;font-family:var(--pop);font-size:13px;padding:2px 8px;border-radius:8px;color:var(--paper);background:var(--mute)}
.rar.r1{background:var(--blue)}.rar.r2{background:var(--green)}.rar.r3{background:var(--red)}.rar.r4{background:var(--gold)}
.st{font-size:14px;color:var(--mute);font-variant-numeric:tabular-nums}
.burst{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:26px 8px;overflow:hidden;background:var(--paper);border:3px solid var(--ink);border-radius:6px}
.burst:before{content:"";position:absolute;inset:-40%;background:repeating-conic-gradient(var(--ink) 0 1.2deg,transparent 1.2deg 9deg);-webkit-mask:radial-gradient(circle,transparent 38%,#000 62%);mask:radial-gradient(circle,transparent 38%,#000 62%);opacity:.8}
.burst>*{position:relative}
.book{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

.lane{position:relative;height:230px;border:3px solid var(--ink);background:var(--paper);overflow:hidden;border-radius:6px}
.lane:after{content:"";position:absolute;left:0;right:0;bottom:36px;border-top:3px solid var(--ink)}
.base{position:absolute;bottom:39px;font-size:44px;line-height:1}
.hpb{position:absolute;top:6px;width:44%;height:12px;border:2px solid var(--ink);border-radius:6px;overflow:hidden;background:var(--paper)}
.hpb i{display:block;height:100%;background:var(--green)}
.hpb.e i{background:var(--red)}
.u{position:absolute;bottom:40px;width:64px;margin-left:-32px;--s:64px;transition:left .12s linear}

.pow{position:absolute;bottom:80px;font-family:var(--pop);font-size:18px;padding:12px 16px;background:#ffd84a;clip-path:polygon(50% 0,60% 22%,84% 8%,76% 34%,100% 40%,78% 56%,92% 82%,66% 72%,56% 100%,44% 74%,18% 92%,24% 62%,0 56%,22% 40%,10% 14%,38% 24%);transform:translateX(-50%);z-index:3;pointer-events:none}
.en{height:16px;border:3px solid var(--ink);border-radius:9px;overflow:hidden;background:var(--paper)}

.dk{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.dkb{display:flex;flex-direction:column;align-items:center;background:var(--paper);border:3px solid var(--ink);border-radius:12px;padding:4px 0;--s:min(19vw,76px);font-family:var(--pop);font-size:13px;min-width:0}

.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.cd{min-height:68px;background:var(--ink);color:var(--paper);border-radius:10px;font-size:13px;font-weight:900;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px}

.code{font-family:var(--pop);font-size:52px;letter-spacing:.12em;text-align:center;font-variant-numeric:tabular-nums}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keys button{min-height:58px;background:var(--paper);border:3px solid var(--ink);border-radius:12px;font-family:var(--pop);font-size:24px}
.note{font-size:14px;color:var(--mute);line-height:1.6}
@media (prefers-reduced-motion:reduce){.u{transition:none}}
/* ===== 試作3：ネオンの夜空 ＋ 光るカード（マゼモンの質感を参考に、オリジナルの見た目） ===== */

@keyframes ipA{from{transform:translateX(0) scale(1)}to{transform:translateX(16px) scale(1.15)}}
@keyframes ipB{0%,40%{transform:scale(1);filter:none;opacity:1}80%{transform:scale(.3) rotate(90deg);filter:grayscale(1);opacity:.2}100%{transform:scale(0);opacity:0}}
@keyframes ipC{0%,60%{opacity:0;transform:scale(.4)}100%{opacity:1;transform:scale(1.2)}}
.sweat{font-size:36px!important;left:auto!important;right:-4px;top:-6px!important}
.mini.hint{box-shadow:0 0 0 4px #ffd84a,0 0 22px #ffd84a!important;animation:auraH 1s ease-in-out infinite;position:relative}
.mini.hint:after{content:"👈";position:absolute;right:-6px;top:50%;font-size:28px;transform:translateY(-50%);animation:flo .8s infinite}
@keyframes auraH{50%{box-shadow:0 0 0 6px #ffd84a,0 0 34px #ffd84a}}
.ip span{animation:ipB 3.6s ease-in infinite!important}.ip em{animation:ipC 3.6s ease-in infinite!important}
.ip:nth-child(2) span,.ip:nth-child(2) em{animation-delay:1.2s!important}.ip:nth-child(3) span,.ip:nth-child(3) em{animation-delay:2.4s!important}
.rule{gap:6px}.rp{padding:6px 10px;gap:4px;align-items:center}.rw{position:relative;font-size:38px}.ra{font-size:22px;color:#fff;text-shadow:0 0 4px #000}.rx{font-size:20px}
.mus{position:absolute;font-style:normal;font-size:.5em;left:-.45em;bottom:-.2em}
.vs{gap:22px;min-height:64px}.vs-w{font-size:60px}.vs-m{font-size:40px!important;color:#ffd84a!important;text-shadow:0 0 10px #ffd84a}
.bdg{font-size:18px!important;padding:2px 10px!important}.bdg.up:before{content:"💪 "}.bdg.dn:before{content:"💦 "}
.bigc .tcr,.bigc .in>div:nth-child(2){font-size:11px;opacity:.6}
.chain{display:flex;align-items:center;justify-content:center;gap:6px;padding:4px 8px;background:#0a1040;border:2px solid #7fe4ff;border-radius:14px}

/* 試作8：属性を6つに（☀ひかり＝金と白い光／🌑やみ＝紫の光の粒・暗くしすぎない／⚪ノーマル＝白〜灰の素直な色） */
.el-y{--ec:#ffc61a;--el2:#fff7c8}.el-k{--ec:#9a55ff;--el2:#e0c8ff}.el-n{--ec:#b9bdc9;--el2:#ffffff}
.ec-y{--ec:#ffc61a}.ec-k{--ec:#9a55ff}.ec-n{--ec:#d9dce4}
.tc.y,.bc.y{--c1:#fff3a0;--c2:#e0a800;--bg1:#fffbe0;--bg2:#ffd23c;--bg3:#7a5200}
.tc.k,.bc.k{--c1:#e0c8ff;--c2:#7a35e0;--bg1:#e6d2ff;--bg2:#9a55ff;--bg3:#2a0e5e}
.tc.n,.bc.n{--c1:#ffffff;--c2:#9aa0ad;--bg1:#ffffff;--bg2:#d9dce4;--bg3:#5a6070}
.bigc.y{--c1:#fff3a0;--c2:#e0a800}.bigc.k{--c1:#e0c8ff;--c2:#7a35e0}.bigc.n{--c1:#ffffff;--c2:#9aa0ad}
.egs.el-y{background:radial-gradient(circle at 50% 55%,#ffffff 0,#fffbe0 30%,#ffe680 60%,#c99a00 95%)}
.egs.el-k{background:radial-gradient(circle at 50% 55%,#c9a2ff 0,#7a35e0 40%,#2a0e5e 85%)}
.egs.el-n{background:radial-gradient(circle at 50% 55%,#ffffff 0,#d9dce4 40%,#6a7080 90%)}
.egs.out.el-y:before{background:repeating-conic-gradient(#fff 0 5deg,transparent 5deg 12deg);opacity:.75}
/* ノーマルは色を重ねない（灰色を重ねると「たおれた」に見えるため）＝絵はそのまま、白いわくだけ */
.ec-n.art:after,.ec-n.art:before,.ec-n .art:after{opacity:0}.bornw.ec-n:after{opacity:0}
.ec-n img,.bornw.ec-n .born{filter:saturate(.1) brightness(1.15) contrast(.95)}
/* ひかり・やみは 見本の絵が赤・青なので、絵ぜんたいに その色を重ねる（金の子・紫の子に見せる） */
.ec-y.art:after,.ec-k.art:after{background:linear-gradient(to top,var(--ec) 0,var(--ec) 45%,color-mix(in srgb,var(--ec) 60%,transparent) 100%);opacity:.7}
.bornw.ec-y:after,.bornw.ec-k:after{background:linear-gradient(to top,var(--ec) 0,var(--ec) 45%,color-mix(in srgb,var(--ec) 60%,transparent) 100%);opacity:.7}
.ick{display:inline-block;filter:drop-shadow(0 0 3px #e0c8ff) drop-shadow(0 0 6px #9a55ff)}
.icy{display:inline-block;filter:drop-shadow(0 0 5px #fff6b0)}
.icn{display:inline-block;filter:drop-shadow(0 0 2px #1a1a3a)}
/* 生まれる時と絵のまわりの粒の動き：🔥上へ・💧下へ・🍃まう（試作7）＋ ✨その場でまたたく・🟣ゆっくり ふわふわ のぼる・⚪ぽよんと はずむ */
.fx-y{top:var(--t,40%);animation:fxtw 1.6s ease-in-out var(--d) infinite}
.fx-k{bottom:0;animation:fxdr 4.2s ease-in-out var(--d) infinite}
.fx-n{top:var(--t,40%);animation:fxbo 2s ease-in-out var(--d) infinite}
@keyframes fxtw{0%,100%{transform:scale(.2) rotate(0);opacity:0}50%{transform:scale(1.4) rotate(90deg);opacity:1}}
@keyframes fxdr{0%{transform:translate(0,0) scale(.6);opacity:0}25%{opacity:.95}50%{transform:translate(24px,-30vh) scale(1)}75%{opacity:.9}100%{transform:translate(-18px,-60vh) scale(.7);opacity:0}}
@keyframes fxbo{0%,100%{transform:translateY(0) scale(1,1);opacity:.85}45%{transform:translateY(-26px) scale(.95,1.05)}55%{transform:translateY(-26px)}90%{transform:translateY(0) scale(1.15,.85)}}
.ec-y .pa,.ec-y .pb,.ec-y .pc{animation:fxtw 1.4s ease-in-out infinite}.ec-y .pb{animation-delay:.45s}.ec-y .pc{animation-delay:.9s}
.ec-k .pa,.ec-k .pb,.ec-k .pc{animation:kdr 3s ease-in-out infinite}.ec-k .pb{animation-delay:1s}.ec-k .pc{animation-delay:2s}
@keyframes kdr{0%{transform:translate(0,8px) scale(.7);opacity:0}30%{opacity:1}100%{transform:translate(8px,-18px) scale(1.1);opacity:0}}
.ec-n .pa,.ec-n .pb,.ec-n .pc{animation:fxbo 2s ease-in-out infinite}
.ec-y.art{box-shadow:0 0 22px #fff6b0,0 0 10px #ffc61a,0 0 0 2px #1a1a3a}.ec-k.art{box-shadow:0 0 18px #b080ff,0 0 0 2px #1a1a3a}.ec-n.art{box-shadow:0 0 10px #ffffffaa,0 0 0 2px #1a1a3a}
.pick .pk.el-n{color:#1a1a3a;text-shadow:none}
/* 鎖：三角（🔥➡🍃➡💧➡🔥）と ☀⇔🌑 を2つの まとまりで（せまい画面では2行に） */
.chain{flex-wrap:wrap;row-gap:2px}.chg{display:flex;align-items:center;gap:4px}.chg+.chg{padding-left:8px;border-left:2px solid #7fe4ff55}
.ch-i{font-size:28px}.ch-a{font-size:20px}.ch-both{font-size:22px;letter-spacing:-2px}
.fx-k,.ec-k .pa,.ec-k .pb,.ec-k .pc{filter:saturate(2.2) brightness(1.35) drop-shadow(0 0 6px #e0c8ff) drop-shadow(0 0 10px #b07cff)!important}
.fx-y,.ec-y .pa,.ec-y .pb,.ec-y .pc{filter:drop-shadow(0 0 6px #fff) drop-shadow(0 0 10px #ffd23c)!important}
.ip2{height:78px}.ip.el-y{margin-top:6px}
.ip:nth-child(4) span,.ip:nth-child(4) em,.ip:nth-child(5) span,.ip:nth-child(5) em{animation-delay:.6s!important}
.nob{display:flex;align-items:center;gap:2px;background:#fff;border-radius:10px;padding:4px 10px;font-size:22px}
</style>
