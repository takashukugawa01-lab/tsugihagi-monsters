<style>
/* 漫画の原稿用紙の上で遊ぶ：白い紙、青いけい線、黒いインク。単一の見た目に決めている */
:root{--paper:#fdfdfb;--rule:#cfe6ee;--ink:#17171b;--mute:#6c6c75;--red:#e5484d;--blue:#2f7fd6;--green:#2fa35a;--gold:#c8930a;--pop:'Mochiy Pop One','Hiragino Maru Gothic ProN',sans-serif;--body:'Zen Maru Gothic','Hiragino Maru Gothic ProN',sans-serif;color-scheme:light}

.big{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:68px;background:var(--ink);color:var(--paper);font-family:var(--pop);font-size:22px;border-radius:14px 18px 12px 20px;padding-inline:12px}
.big.sub{background:var(--paper);color:var(--ink);border:3px solid var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1 1 140px;min-width:0}
.guide{display:flex;gap:10px;align-items:flex-end}
.guide img{width:84px;height:84px;object-fit:cover;object-position:top;border-radius:50%;border:3px solid var(--ink);flex:none;background:#111}
.bubble{position:relative;background:var(--paper);border:3px solid var(--ink);border-radius:18px;padding:10px 14px;font-weight:900;font-size:17px;min-width:0}

.steps{display:flex;gap:8px}
.slot{flex:1;min-width:0;aspect-ratio:1;border:3px dashed var(--ink);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:clamp(26px,9vw,40px);background:var(--paper)}

.part{position:relative;aspect-ratio:1;background:var(--paper);border:2px solid var(--ink);border-radius:10px;font-size:clamp(24px,8vw,36px);display:flex;align-items:center;justify-content:center}

.mon{position:relative;width:var(--s);height:var(--s);flex:none}
.mon svg{display:block;width:100%;height:100%;pointer-events:none;overflow:visible}
.stage{position:relative;height:340px;overflow:hidden;background:radial-gradient(circle,#555568,#1d1d26);border:3px solid var(--ink);border-radius:8px;display:flex;align-items:center;justify-content:center}
.stage .vx{position:absolute;inset:0}
.stage .vx span{position:absolute;left:50%;top:50%;font-size:46px;margin:-23px 0 0 -23px;animation:spin .9s cubic-bezier(.5,0,.9,.6) var(--d) forwards}
@keyframes spin{from{transform:rotate(var(--a)) translateX(120px) rotate(calc(var(--a)*-1)) scale(1.1)}to{transform:rotate(calc(var(--a) + 720deg)) translateX(0) rotate(calc(var(--a)*-1 - 720deg)) scale(.05)}}
.stage .newm{display:none}
.stage[data-p="2"] .vx,.stage[data-p="3"] .vx{display:none}
.stage[data-p="2"] .newm{display:block;filter:brightness(0) drop-shadow(0 0 8px #fffa);animation:shake .5s}
.stage[data-p="3"] .newm{display:block;animation:pop .5s}
.stage .fl{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.stage[data-p="3"] .fl{animation:flash .6s}
.stage .tap{position:absolute;bottom:8px;left:0;right:0;text-align:center;color:#bbb;font-size:13px}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px) scale(.9)}40%{transform:translateX(6px) scale(.95)}60%{transform:translateX(-4px) scale(1)}80%{transform:translateX(4px)}}
@keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.15)}100%{transform:scale(1)}}

.pops{animation:pop .5s}
.stage .qq{display:none;position:absolute;top:10px;left:0;right:0;text-align:center;font-family:var(--pop);font-size:40px;color:#fff;animation:shake .5s infinite}

.stage[data-p="3"]:before{content:"";position:absolute;inset:-40%;background:repeating-conic-gradient(var(--rc) 0 3deg,transparent 3deg 12deg);animation:flash .9s;pointer-events:none}
.tc{position:relative;border:4px solid var(--ink);border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:6px;background:#fff;box-shadow:5px 5px 0 var(--ink);--tc:#cfd2da}

.dot.r{background:var(--red)}.dot.b{background:var(--blue)}.dot.g{background:var(--green)}
.tcv{background:#ffd84a;border:3px solid var(--ink);border-radius:10px;padding:6px 10px;font-family:var(--pop);font-size:17px}

.legend{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--mute)}

.sheet{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

.nm{font-family:var(--pop);font-size:18px;overflow-wrap:anywhere}

.st{font-size:14px;color:var(--mute);font-variant-numeric:tabular-nums}
.burst{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:26px 8px;overflow:hidden;background:var(--paper);border:3px solid var(--ink);border-radius:6px}
.burst:before{content:"";position:absolute;inset:-40%;background:repeating-conic-gradient(var(--ink) 0 1.2deg,transparent 1.2deg 9deg);-webkit-mask:radial-gradient(circle,transparent 38%,#000 62%);mask:radial-gradient(circle,transparent 38%,#000 62%);opacity:.8}

.base{position:absolute;bottom:39px;font-size:44px;line-height:1}

.hpb i{display:block;height:100%;background:var(--green)}

.u{position:absolute;bottom:40px;width:64px;margin-left:-32px;--s:64px;transition:left .12s linear}

.dk{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}

.code{font-family:var(--pop);font-size:52px;letter-spacing:.12em;text-align:center;font-variant-numeric:tabular-nums}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keys button{min-height:58px;background:var(--paper);border:3px solid var(--ink);border-radius:12px;font-family:var(--pop);font-size:24px}
.note{font-size:14px;color:var(--mute);line-height:1.6}
@media (prefers-reduced-motion:reduce){.u{transition:none}}

const INK="#1a1a3a";
const rng=(a)=>{let s=(a>>>0)||1;return()=>{s=(Math.imul(s,1664525)+1013904223)>>>0;return s/4294967296}};
const seedOf=(m)=>(m[0]*7919+m[1]*104729+m[2]*1299709+m[3]*15485863+(m[4]|0)*2654435761+12345)>>>0;
const f1=(x)=>Math.round(x*10)/10;
const TH=(d,w,c)=>`<path d="${d}" fill="none" stroke="${INK}" stroke-width="${w+5}"/><path d="${d}" fill="none" stroke="${c}" stroke-width="${w}"/>`;
const EL=(x,y,rx,ry,c,e="")=>`<ellipse cx="${f1(x)}" cy="${f1(y)}" rx="${f1(rx)}" ry="${f1(ry)}" fill="${c}" ${e}/>`;
const PA=(d,c,e="")=>`<path d="${d}" fill="${c}" ${e}/>`;
const PO=(p,c,e="")=>PA("M"+p.map(q=>f1(q[0])+" "+f1(q[1])).join("L")+"Z",c,e);
const STAR=(r)=>{const p=[];for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,k=i%2?r*.45:r;p.push([Math.cos(a)*k,Math.sin(a)*k])}return p};

h(`<div class="stage" id="stg" data-p="1" style="--rc:${RC[r]}"><div class="vx">${em.map((e,i)=>`<span style="--a:${i*90}deg;--d:${i*.06}s">${e}</span>`).join("")}</div><div class="newm" style="--s:230px">${mon(m)}</div><div class="qq">？</div><div class="strs">${[0,1,2,3,4].map(i=>`<i id="sr${i}">☆</i>`).join("")}</div><div class="fl"></div><div class="tap">さわると とばせるよ</div></div>`);
const stg=document.getElementById("stg");stg.addEventListener("click",end);
[300,420,540,660,780].forEach((t,i)=>btm.push(setTimeout(()=>beep(300+i*130,.1),t)));
btm.push(setTimeout(()=>{stg.dataset.p="2";beep(110,.35)},1100));
for(let i=0;i<=r;i++)btm.push(setTimeout(()=>{const e=document.getElementById("sr"+i);if(e){e.textContent="★";e.style.color=RC[r]}beep(500+i*140,.14)},1450+i*260));
const t3=1450+(r+1)*260+450;
btm.push(setTimeout(()=>{stg.dataset.p="3";[880,1100,1320,1760].forEach((f,i)=>setTimeout(()=>beep(f,.16),i*90))},t3));
btm.push(setTimeout(end,t3+900))}
// ずかん
const K=(s)=>s.split(",").map(Number);
function book(){h(`<h2>ずかん ${save.book.length} / 1000</h2><p class="note">さわると たたかう3ひきを えらべるよ（きいろが えらんだもの）</p>
<div class="book">${save.book.map((s,i)=>{const m=K(s),c=calc(m);return`<button class="bk ${save.deck.includes(s)?"on":""}" data-g="d${i}" style="--s:84px">${mon(m)}${rar(c.r)}<span>${c.name}</span></button>`}).join("")||"<p>まだ いないよ</p>"}</div><button class="big sub" data-g="title">もどる</button>`)}
function toggleDeck(i){const s=save.book[i];if(save.deck.includes(s))save.deck=save.deck.filter(x=>x!==s);else{save.deck.unshift(s);save.deck=save.deck.slice(0,4)}store();book()}
const myDeck=()=>{const d=(save.deck.length?save.deck:save.book.slice(0,3)).map(K);return d.slice(0,3)};
// ===== カードバトル（ターン制・3たいで たたかう。どちらの携帯でも 自分が下）=====
let S=null,me=0,mode="",raf=0,N={},M=null,cpuAt=0,lastKey="",uid=1;
function newState(d0,d1){const dk=[d0.slice(0,3),d1.slice(0,3)],hp=dk.map(d=>d.map(m=>calc(m).hp));return{deck:dk,hp,mx:hp.map(a=>a.slice()),act:[0,0],en:[1,1],turn:0,fx:null,msg:"",v:0,over:null}}
function doAct(side,a){if(!S||S.over!==null||S.turn!==side)return;const t=1-side,cur=S.deck[side][S.act[side]];if(!cur)return;const cc=calc(cur);
if(a.k==="sw"){if(!S.deck[side][a.i]||S.hp[side][a.i]<=0||a.i===S.act[side])return;S.act[side]=a.i;S.msg=calc(S.deck[side][a.i]).name+"、でばん！";S.fx={side,n:0,tag:"🔁",id:S.v+1}}
else{if(a.k==="sp"){if(S.en[side]<2)return;S.en[side]-=2}else S.en[side]=Math.min(3,S.en[side]+1+(cc.skill===4?1:0));
const ti=S.act[t],cd=calc(S.deck[t][ti]),mult=a.k==="sp"?2.2*(1+Math.min(a.n||0,24)/24):1.5;let x=cc.atk*mult*(.9+Math.random()*.2),tag="";
if(WIN[cc.ty]===cd.ty){x*=1.5;tag="こうかばつぐん！"}else if(WIN[cd.ty]===cc.ty){x*=.7;tag="いまひとつ…"}
if(cd.skill===3)x*=.75;if(cc.skill===1)x*=1.25;if(cc.skill===2&&Math.random()<.25){x*=1.6;tag=tag||"きゅうしょ！"}
x=Math.round(x);S.hp[t][ti]=Math.max(0,S.hp[t][ti]-x);const ai=S.act[side];
if(cc.skill===5)S.hp[side][ai]=Math.min(S.mx[side][ai],S.hp[side][ai]+Math.round(x*.3));if(cc.skill===0)S.hp[side][ai]=Math.min(S.mx[side][ai],S.hp[side][ai]+Math.round(S.mx[side][ai]*.1));
S.msg=(a.k==="sp"?moveName(cur)+"！":cc.name+"の こうげき！")+(tag?"　"+tag:"");S.fx={side:t,n:x,tag,sp:a.k==="sp",id:S.v+1};
if(S.hp[t][ti]<=0){const nx=S.hp[t].findIndex(h=>h>0);if(nx<0)S.over=side;else S.act[t]=nx}}
S.turn=1-S.turn;S.v++}
function act(a){if(mode==="guest"){if(N.conn&&N.conn.open)N.conn.send({t:"a",a})}else doAct(0,a);beep(990,.05)}
function apply(side,a){doAct(side,a)}
const ICON={r:"🔥",b:"💧",g:"🍃"};
function bcard(side,i,big){const m=S.deck[side][i],c=calc(m),hp=S.hp[side][i],mx=S.mx[side][i],hit=S.fx&&S.fx.id===S.v&&S.fx.side===side&&big;
return`<div class="bc ${c.ty} q${c.r}${hit?" hit":""}${hp<=0?" ko":""}${big?"":" mini"}"><div class="bcn"><span>${ICON[c.ty]} ${c.name}</span></div><div class="bcw"><div class="mon${side===me?"":" flip"}" style="--s:${big?"clamp(120px,36vw,170px)":"54px"}">${art(m)}</div>${hit&&S.fx.n?`<b class="dm">${S.fx.n}</b>`:""}${hit&&S.fx.tag?`<i class="tg">${S.fx.tag}</i>`:""}</div><div class="hpw"><i style="width:${Math.max(0,hp/mx*100)}%"></i></div>${big?`<div class="bcs">HP ${Math.max(0,hp)} / ${mx}　<span class="pips">${[0,1,2].map(k=>`<u class="${k<S.en[side]?"on":""}">⚡</u>`).join("")}</span></div>`:""}</div>`}
function view(){const my=me,fo=1-me,mt=S.turn===my&&S.over===null;
const ben=(side,mine)=>S.deck[side].map((m,i)=>i===S.act[side]?"":mine?`<button class="bw" data-g="wp${i}" ${mt&&S.hp[side][i]>0?"":"disabled"}>${bcard(side,i,false)}</button>`:`<div class="bw">${bcard(side,i,false)}</div>`).join("");
const ctl=M?`<div class="mashw"><div class="mt"><i></i></div><button class="mash" data-g="mash">れんだ！！<b id="mn">0</b></button></div>`
:`<div class="acts"><button class="ab a1" data-g="atk" ${mt?"":"disabled"}>⚔️ こうげき<small>⚡ +1</small></button><button class="ab a2" data-g="spx" ${mt&&S.en[my]>=2?"":"disabled"}>💥 ひっさつ<small>⚡⚡ れんだで つよく！</small></button></div>`;
h(`<div class="arena"><div class="row3">${ben(fo,false)}</div>${bcard(fo,S.act[fo],true)}<div class="bmsg">${S.msg||"たたかい かいし！"}<small>${S.over!==null?"":mt?"👉 あなたの ばん":"…あいての ばん"}</small></div>${bcard(my,S.act[my],true)}<div class="row3">${ben(my,true)}</div>${ctl}<div class="legend"><span><i class="dot r"></i>あか→<i class="dot g"></i>みどり</span><span><i class="dot g"></i>みどり→<i class="dot b"></i>あお</span><span><i class="dot b"></i>あお→<i class="dot r"></i>あか</span><span>（→は「つよい」）</span></div></div><button class="note" data-g="title">やめる</button>`);
if(M){const e=document.querySelector(".mt i");if(e){e.style.animationDuration="2s"}}}
function loop(){const now=performance.now();
if(M&&now>=M.end){const n=M.n;M=null;lastKey="";act({k:"sp",n})}
if(mode!=="guest"&&S&&S.over===null&&mode==="cpu"&&S.turn===1){if(!cpuAt)cpuAt=now+1100;if(now>=cpuAt){cpuAt=0;const c=S.deck[1][S.act[1]],lowHp=S.hp[1][S.act[1]]<S.mx[1][S.act[1]]*.3,sw=S.hp[1].findIndex((h,i)=>h>0&&i!==S.act[1]);if(lowHp&&sw>=0&&Math.random()<.35)doAct(1,{k:"sw",i:sw});else if(S.en[1]>=2&&Math.random()<.6)doAct(1,{k:"sp",n:6+Math.floor(Math.random()*12)});else doAct(1,{k:"atk"})}}
if(S){const key=S.v+":"+(M?1:0);if(key!==lastKey){lastKey=key;view();if(mode==="host"&&N.conn&&N.conn.open)N.conn.send({t:"s",S})}if(S.over!==null&&!S.shown&&!M)setTimeout(()=>{if(S&&!S.shown)result()},900)}
raf=requestAnimationFrame(loop)}
function stop(){cancelAnimationFrame(raf);M=null;cpuAt=0;if(N.conn)try{N.conn.close()}catch(e){}if(N.peer)try{N.peer.destroy()}catch(e){}N={};S=null}
function go(){lastKey="";cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
function battle(m){stop();mode=m;me=0;const foe=[0,1,2].map((_,i)=>KEYS.map(k=>{const idx=P[k].map((p,j)=>p.st===1||(i>0&&p.st===2&&save.book.length>3)?j:-1).filter(j=>j>=0);return idx[Math.floor(Math.random()*idx.length)]}).concat([1+Math.floor(Math.random()*99999)]));S=newState(myDeck(),foe);go()}function result(){if(mode==="host"&&N.conn&&N.conn.open)N.conn.send({t:"s",S});S.shown=true;cancelAnimationFrame(raf);const win=S.over===me;let txt=win?"かった！":"まけた…つぎは かてるよ";let got="";
if(win){const lock=[];KEYS.forEach(k=>P[k].forEach((p,i)=>{if(!isOpen(k,i))lock.push([k,i,p])}));lock.sort((a,b)=>a[2].st-b[2].st+Math.random()-.5);const pz=lock.slice(0,2);pz.forEach(([k,i])=>save.open.push(k+i));store();got=pz.map(x=>x[2].e+" "+x[2].n).join("、");if(got)txt+="　あたらしい パーツ："+got}
win?[880,1100,1320,1760].forEach((f,i)=>setTimeout(()=>beep(f,.18),i*140)):beep(220,.3);say(win?"かった！":"まけた。つぎは かてるよ");
h(`<div class="burst"><h1>${win?"かち！":"まけ…"}</h1></div>${guide(txt)}<button class="big" data-g="again">✂️ つくる</button><button class="big sub" data-g="${mode==="cpu"?"cpu":"vs"}">もう1かい</button><button class="big sub" data-g="title">おわり</button>`);const m=mode;if(m!=="cpu"){setTimeout(()=>{if(N.conn)try{N.conn.close()}catch(e){}},500)}}
// ふたりで（別の携帯と）
let typed="";
function vs(){stop();const ok=typeof Peer!=="undefined"&&window.RTCPeerConnection;let inFrame=false;try{inFrame=window.top!==window}catch(e){inFrame=true}
h(`<h2>ふたりで たたかう</h2>${guide("べつの けいたいと つなごう！")}${ok&&!inFrame?`<button class="big" data-g="host">📣 へやを つくる</button><button class="big sub" data-g="join">🔢 ばんごうを いれる</button><p class="note">おとな向け：片方の携帯で「へやをつくる」を押すと4けたの番号が出ます。もう片方で番号を入れます。</p>`:`<div class="card"><div>このページでは、べつの携帯と つなげません。対戦用のページから開いてください。</div></div>`}<button class="big sub" data-g="title">もどる</button>`)}
function host(){const code=String(Math.floor(1000+Math.random()*9000));h(`<h2>この ばんごうを おしえてね</h2><div class="code">${code}</div>${guide("あいてを まってるよ…")}<button class="big sub" data-g="title">やめる</button>`);
N.peer=new Peer("tsugihagi-"+code);N.peer.on("error",e=>netErr(e));N.peer.on("connection",c=>{N.conn=c;c.on("data",d=>{if(d.t==="hello"){mode="host";me=0;S=newState(myDeck(),d.deck);c.send({t:"start"});go()}else if(d.t==="a"&&S)apply(1,d.a)});c.on("close",()=>{if(S&&S.over===null)netErr({type:"close"})})})}
function joinScreen(){typed="";keypad()}
function keypad(){h(`<h2>ばんごうを いれてね</h2><div class="code">${typed.padEnd(4,"・")}</div><div class="keys">${[1,2,3,4,5,6,7,8,9,"←",0,"×"].map(n=>`<button data-g="k${n}">${n}</button>`).join("")}</div><button class="big sub" data-g="title">もどる</button>`)}
function key(n){if(n==="←")typed=typed.slice(0,-1);else if(n==="×")typed="";else typed+=n;if(typed.length<4){keypad();return}
h(`<h2>つないでいます…</h2>${guide("ちょっと まってね")}<button class="big sub" data-g="title">やめる</button>`);
N.peer=new Peer();N.peer.on("error",e=>netErr(e));N.peer.on("open",()=>{const c=N.peer.connect("tsugihagi-"+typed,{reliable:true});N.conn=c;c.on("open",()=>c.send({t:"hello",deck:myDeck()}));c.on("data",d=>{if(d.t==="start"){mode="guest";me=1;S=newState([],[])}else if(d.t==="s"){const first=!S||!S.deck[0].length;const sh=S&&S.shown;S=d.S;S.shown=sh;if(first)go()}});c.on("close",()=>{if(S&&S.over===null)netErr({type:"close"})})})}
function netErr(e){const shown=S&&S.shown;if(shown)return;cancelAnimationFrame(raf);const t=e&&e.type==="peer-unavailable"?"その ばんごうの へやが ないよ":"つながらなかったよ";const s=N;N={};S=null;try{s.peer&&s.peer.destroy()}catch(x){}h(`${guide(t)}<p class="note">おとな向け：2台とも同じ Wi-Fi か、電波のよい場所で試してください。無料の接続サービスが混んでいるときも失敗します。</p><button class="big" data-g="vs">もう1かい</button><button class="big sub" data-g="title">もどる</button>`)}
window.__g={P,calc,save,get S(){return S},art,nameOf};
// 見本12匹（確認用：ページの最後に #sheet を付けて開く）
function sheet(){const S12=[[0,21,5,20],[8,3,1,6],[14,10,0,8],[5,1,3,9],[11,25,4,2],[22,28,11,15],[13,35,26,43],[47,12,13,3],[39,4,2,40],[31,41,17,24],[15,16,33,42],[48,6,31,38]];
h(`<h2>見本12ひき</h2><div class="sheet">${S12.map(m=>`<div><div class="mon" style="--s:min(30vw,170px);margin:auto">${art(m)}</div>${nameOf(m)}<br>${m.map((x,i)=>P[KEYS[i]][x].e).join("")}</div>`).join("")}</div>`)}
if(location.hash==="#sheet")sheet();else title();
</script>
